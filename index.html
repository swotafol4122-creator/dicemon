<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ころがれ！ダイスモン</title>
<meta name="description" content="サイコロで たたかい、あつめて、まぜて、そだてる。すごろく×モンスター収集RPG">
<meta name="theme-color" content="#26213A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ダイスモン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== ころがれ！ダイスモン ===== */
:root{
  --ink:#26213A; --ink2:#5B5574; --paper:#FFFFFF; --paper2:#F1F5FC; --line:#D9DEEA;
  --sky:#BFE3FF; --felt:#1D6B51; --felt2:#155440; --pip:#E5383B; --gold:#FFC928; --gold2:#E8A800;
  --atk:#E5383B; --def:#3567D6; --heal:#22A65A; --luck:#F2B300;
  --fd:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --fb:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo","Noto Sans JP",sans-serif;
  --fe:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:500 15px/1.6 var(--fb);color:var(--ink);background:var(--sky);
  background-image:radial-gradient(circle,rgba(255,255,255,.55) 2.6px,transparent 3px);background-size:22px 22px;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--def);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:400}
small{font-size:12px}
.scr{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(16px + var(--safe-b))}

/* ---- ボタン ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;
  font:700 16px/1.2 var(--fb);background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn.red{background:#FF8A8A}
.btn.blue{background:#8FC7FF}
.btn.big{min-height:58px;font-size:19px;width:100%}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:0 4px 0 var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px;white-space:nowrap}
.chip.coin{background:#FFF1B8}
.tg{border:2px solid var(--ink);border-radius:10px;padding:3px 9px;background:var(--paper);font-weight:700;font-size:13px}
.tg.on{background:var(--ink);color:#fff}

/* ---- トップバー ---- */
.tb{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 8px;background:var(--paper);border-bottom:3px solid var(--ink)}
.tbb{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--paper2);flex:none}
.tbb svg{width:20px;height:20px}
.tbt{font:20px/1.2 var(--fd);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font:17px/1.3 var(--fd);margin:18px 14px 8px;display:flex;align-items:baseline;gap:8px}
.sec small{font:500 12px var(--fb);color:var(--ink2)}
.lead{margin:12px 14px;font-size:14px;color:var(--ink2)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}

/* ---- ダイスモンの絵 ---- */
.mon{--s:72px;width:var(--s);height:var(--s);position:relative;display:inline-block;flex:none}
.mon .bod{position:absolute;inset:0}
.mon .emo{position:absolute;inset:0;display:grid;place-items:center;font:calc(var(--s)*.8)/1 var(--fe)}
.mon .eyes{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mon.idle .bod{animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--bd)*-1)}
.mon.idle .ey>ellipse,.mon.idle .ey>circle{animation:blink 4.6s infinite;animation-delay:calc(var(--bd)*-1);transform-box:fill-box;transform-origin:center}
.mon.shiny .emo{filter:hue-rotate(150deg) saturate(1.35) brightness(1.06)}
.mon .spk{position:absolute;right:-2px;top:-4px;font-style:normal;color:#FFB800;font-size:calc(var(--s)*.26);text-shadow:0 0 6px #fff;animation:twinkle 1.4s infinite}
.mon.sil .emo{filter:brightness(0);opacity:.8}
.mon.hurt .bod{animation:shake .32s}
.mon.faint .bod{animation:none;filter:grayscale(1);opacity:.45;transform:translateY(8%) rotate(-8deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9%)}50%{transform:translateX(7%)}75%{transform:translateX(-4%)}}

.eltag{display:inline-block;padding:0 8px;border-radius:999px;background:var(--ec);color:#fff;font-weight:700;font-size:12px;line-height:20px;border:2px solid var(--ed);text-shadow:0 1px 0 var(--ed)}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--rc);color:#fff;font:13px/1 var(--fd);border:2px solid var(--ink)}
.hpb{height:9px;border:2px solid var(--ink);border-radius:6px;background:#E9ECF3;overflow:hidden;position:relative}
.hpb i{position:absolute;left:0;top:0;bottom:0;background:#2FC26B;transition:width .35s ease}
.hpb.mid i{background:#F5B700}.hpb.low i{background:#EF4444}
.hpb .shd{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#8FC7FF 0 4px,#5EA8F5 4px 8px);opacity:.9}

/* ---- サイコロ ---- */
.fc{position:absolute;inset:0;border:3px solid var(--ink);border-radius:22%;background:#FFFDF8;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 -5px 0 rgba(38,33,58,.08)}
.fc .fi{width:46%;height:46%;margin-top:-10%}
.t-A{color:var(--atk)}.t-D{color:var(--def)}.t-H{color:var(--heal)}.t-L{color:var(--luck)}
.t-L .fi{width:58%;height:58%;margin:0}
.fc .pp{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:9%}
.fc .pp i{width:13%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.fc.p1 .pp i{width:19%;background:var(--pip)}
.t-S{background:color-mix(in srgb,var(--ec) 22%,#FFFDF8);color:var(--ed)}
.t-S .fi{color:var(--ec);width:40%;height:40%;margin-top:-22%}
.t-S .fl{position:absolute;left:4%;right:4%;bottom:9%;text-align:center;font:700 calc(var(--ds,58px)*.17)/1.1 var(--fb);white-space:nowrap;overflow:hidden;letter-spacing:-.04em}
.t-X{background:#F2F0EA}
.t-X::after{content:"";width:22%;aspect-ratio:1;border-radius:50%;border:2px dashed #BDB8C9}
.t-Z{background:#DDE1EA;color:var(--ink2)}
.t-Z .zz{font:calc(var(--ds,58px)*.3)/1 var(--fd)}
.pipf{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%;gap:4%;place-items:center}
.pipf i{width:76%;aspect-ratio:1;border-radius:50%;background:var(--ink)}
.pipf i.one{width:150%;background:var(--pip)}
.pipf b{width:0}
.d3{--ds:58px;width:var(--ds);height:var(--ds);position:relative;flex:none}
.d3{perspective:540px}
.d3t{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-13deg) rotateY(15deg)}
.d3.flat .d3t{transform:none}
.cube{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--rt,.72s) cubic-bezier(.2,.85,.3,1.12)}
.cf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf0{transform:translateZ(calc(var(--ds)/2))}
.cf1{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.cf2{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.cf3{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.cf4{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.cf5{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.d3s{position:absolute;left:12%;right:12%;bottom:-12%;height:14%;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(2px)}
.d3.hop .d3t{animation:hop var(--rt,.72s) ease-out}
.d3.hop .d3s{animation:hops var(--rt,.72s) ease-out}
@keyframes hop{0%{translate:0 0}30%{translate:0 -42%}62%{translate:0 0}78%{translate:0 -9%}100%{translate:0 0}}
@keyframes hops{30%{transform:scale(.55);opacity:.4}62%{transform:scale(1);opacity:1}}
.fflat{position:relative;width:var(--ds,44px);height:var(--ds,44px);display:inline-block;flex:none}
.iic{display:inline-block;vertical-align:middle;flex:none}.iem{line-height:1;font-family:var(--fe);flex:none}

/* ---- トースト・シート ---- */
#toasts{position:fixed;left:0;right:0;top:calc(10px + var(--safe-t));z-index:200;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:90vw;padding:8px 16px;background:var(--ink);color:#fff;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.gold{background:var(--gold);color:var(--ink);border:3px solid var(--ink)}
.toast.out{opacity:0;transform:translateY(-10px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
.ov{position:fixed;inset:0;z-index:100;background:rgba(24,20,40,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.ov.center{align-items:center;padding:16px}
.sheet{position:relative;width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));transform:translateY(30px);transition:transform .2s ease-out;-webkit-user-select:text;user-select:text}
.ov.center .sheet{border-bottom:3px solid var(--ink);border-radius:22px;max-width:400px;box-shadow:0 6px 0 var(--ink);padding-bottom:18px}
.ov.on .sheet{transform:none}
.sheet .x{position:absolute;right:10px;top:10px;width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:var(--paper2);font:700 20px/1 var(--fb);z-index:2}
.sh{font:19px/1.35 var(--fd);margin:0 40px 10px 0}
.askm{margin:6px 0 4px;font-size:16px;font-weight:700;text-align:center;line-height:1.7}
.inp{width:100%;font:700 16px var(--fb);padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--paper2);color:var(--ink);resize:vertical}
textarea.inp{font:500 12px/1.4 ui-monospace,monospace;word-break:break-all}
.talk{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.talk .tl{font-size:17px;font-weight:700;line-height:1.75;min-height:3.5em;margin:4px 0;white-space:pre-line}
.talkbox{background:#FFFBEA}
.flt{position:fixed;z-index:150;pointer-events:none;transform:translate(-50%,-50%);font:22px/1 var(--fd);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:flt .95s ease-out forwards;white-space:nowrap}
.flt.crit{font-size:28px;color:#FFD23F}.flt.heal{color:#5EE38E}.flt.sh{color:#8FC7FF}.flt.st{font-size:16px;color:#FFB4F0}
.flt.eff{font-size:15px;color:#FF7B54}.flt.weak{font-size:15px;color:#B8C4D6}.flt.miss{font-size:16px;color:#E5E7EE}.flt.buff{font-size:16px;color:#FFE27A}
@keyframes flt{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;margin-top:0;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:-46px}}

/* ---- タイトル ---- */
.title{align-items:center;justify-content:center;gap:18px;padding:30px 18px;text-align:center}
.logo-dice{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.logo-dice .d3{--ds:58px}
.lt{font:30px/1 var(--fd);color:var(--ink)}
.lt.r{color:var(--pip)}
.logo-main{font:clamp(44px,13vw,62px)/1 var(--fd);letter-spacing:.02em;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink)}
.logo-sub{margin:12px 0 0;font-weight:700;font-size:14px;background:var(--paper);display:inline-block;padding:3px 14px;border:2px solid var(--ink);border-radius:999px}
.title-mons{display:flex;gap:4px;justify-content:center;margin:6px 0}
.title-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px}
.ver{font-size:12px;color:var(--ink2);margin:0}

/* ---- さいしょの なかま ---- */
.starters{display:grid;gap:12px;padding:6px 14px}
.stc{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.stc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stc .stx b{font:20px var(--fd);display:block}
.stc .stx p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.stc .mon{background:color-mix(in srgb,var(--ec) 18%,#fff);border-radius:16px;border:2px solid var(--ink)}

/* ---- ホーム ---- */
.hh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--paper);border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:20}
.hh-l{min-width:0}
.pname{font:19px/1.2 var(--fd);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.medals{display:flex;gap:3px;margin-top:4px}
.medal{width:22px;height:22px;border-radius:6px;border:2px dashed #B3B9C9;display:grid;place-items:center;font:13px/1 var(--fe)}
.medal.on{border:2px solid var(--ink);background:var(--gold)}
.resume{margin:12px 14px 0;padding:10px 12px;display:flex;align-items:center;gap:10px;background:#FFF1B8;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);font-weight:700;text-align:left;width:calc(100% - 28px)}
.resume span{flex:1}
.road{list-style:none;margin:0;padding:4px 14px 120px;position:relative}
.road::before{content:"";position:absolute;left:44px;top:20px;bottom:130px;border-left:5px dotted var(--ink);opacity:.35}
.stop{position:relative;margin:0 0 12px}
.stop>button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);text-align:left}
.stop>button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stop-ic{width:56px;height:56px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;font:32px/1 var(--fe);background:var(--ac,#fff);flex:none}
.stop-tx{flex:1;min-width:0}
.stop-tx b{font:18px/1.3 var(--fd);display:block}
.stop-tx small{color:var(--ink2);display:block;line-height:1.4}
.stop-st{font-weight:700;font-size:12px;padding:2px 8px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.st-new{background:var(--pip);color:#fff}.st-clear{background:#BDF2CF}.st-lock{background:#E3E6EE;color:var(--ink2)}
.stop.lock>button{background:#EEF0F5;box-shadow:0 4px 0 #9AA0B4;border-color:#9AA0B4;color:#7C8297}
.stop.lock .stop-ic{filter:grayscale(1);opacity:.6;border-color:#9AA0B4}
.stop.special>button{background:#2D2763;color:#fff}
.stop.special .stop-tx small{color:#CFC9FF}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px calc(8px + var(--safe-b));background:var(--paper);border-top:3px solid var(--ink)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border:2px solid var(--ink);border-radius:14px;background:var(--paper2);font-weight:700;font-size:12px;position:relative}
.bnav button i{font:24px/1 var(--fe);font-style:normal}
.bnav .dot{position:absolute;right:6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pip);border:2px solid var(--ink)}

/* ---- エリア情報 ---- */
.ar-head{display:flex;gap:12px;align-items:center}
.ar-head .stop-ic{width:64px;height:64px;font-size:36px}
.ar-head b{font:22px var(--fd);display:block}
.mini-row{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.mini-row .mon{background:var(--paper2);border-radius:10px;border:2px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:2px dashed var(--line);font-size:14px}
.kv b{font-weight:700}

/* ---- すごろく ---- */
.board{background:#BFE3FF;transition:background .6s}
.board.t-m{background:#D4EEFF}.board.t-d{background:#BFE3FF}.board.t-e{background:#FFCFA6}.board.t-n{background:#2A2C5C}
.board .tb{background:var(--paper)}
.tchip{background:#fff}
.bd-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 10px 18px;-webkit-overflow-scrolling:touch}
.bd{position:relative;margin:0 auto;max-width:400px}
.bd svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tile{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:3px solid var(--ink);border-radius:16px;background:var(--tc);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tile i{font:26px/1 var(--fe);font-style:normal}
.tile small{font-size:10px;font-weight:700;line-height:1}
.tile.used{filter:saturate(.25) brightness(.95);opacity:.75}
.tile.goal{color:var(--gold);width:76px;height:76px;margin:-38px 0 0 -38px}
.tile.goal i{font-size:32px}
.tile .no{position:absolute;left:3px;top:1px;font-size:9px;font-weight:700;opacity:.5}
.tok{position:absolute;z-index:5;width:52px;height:52px;margin:-58px 0 0 -26px;transition:left .14s linear,top .14s linear;pointer-events:none}
.tok .mon{filter:drop-shadow(0 3px 0 var(--ink))}
.tok::after{content:"";position:absolute;left:8px;right:8px;bottom:-6px;height:8px;border-radius:50%;background:rgba(0,0,0,.25)}
.bd-party{display:flex;gap:4px;padding:8px 10px;background:var(--paper);border-top:3px solid var(--ink);overflow-x:auto}
.pm{flex:none;width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700}
.pm .hpb{width:100%;height:7px}
.pm.down .mon{filter:grayscale(1);opacity:.5}
.bd-ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;align-items:center;padding:10px 12px calc(12px + var(--safe-b));background:var(--paper)}
.rollbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:3px solid var(--ink);border-radius:20px;background:var(--pip);color:#fff;box-shadow:0 5px 0 var(--ink);font:20px var(--fd)}
.rollbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.rollbtn .d3{--ds:40px}
.rollbtn:disabled{opacity:.6}

/* ---- バトル ---- */
.battle{background:var(--ac,#9ED38A);min-height:100dvh;padding-bottom:0}
.bt-top{display:flex;align-items:center;gap:6px;padding:calc(6px + var(--safe-t)) 10px 6px;background:var(--paper);border-bottom:3px solid var(--ink)}
.bt-top .turn{flex:1;text-align:center;font:16px var(--fd)}
.bt-side{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 8px}

  if (p[0] !== 'DMGIFT1' || p.length !== 3) throw new Error('こうかんコードの かたちが ちがいます。');
  if (codeSum(p[1]) !== p[2]) throw new Error('コードが とちゅうで きれているか、まちがっています。');
  const d = JSON.parse(b64d(p[1]));
  return { mon: unpackMon(d.m), id: String(d.id), from: String(d.from || 'だれか').slice(0, 10) };
}

function achDone(id) {
  if (S.ach[id]) return false;
  const a = ACH.find(x => x[0] === id); if (!a) return false;
  S.ach[id] = Date.now(); S.achNew++;
  const r = a[3];
  for (const k in r) { if (k === 'coins') addCoins(r[k]); else S.items[k] = (S.items[k] || 0) + r[k]; }
  if (typeof toast === 'function') toast(`🏅 しょうごう「${a[1]}」！`, 'gold');
  if (typeof sfx === 'function') sfx('fanfare');
  return true;
}
function checkAch() {
  const c = caughtCount();
  if (S.st.wins >= 1) achDone('firstwin');
  if (S.st.scouts >= 1) achDone('scout1');
  if (c >= 10) achDone('dex10'); if (c >= 30) achDone('dex30'); if (c >= 50) achDone('dex50'); if (c >= SP_LIST.length) achDone('dex73');
  if (S.st.fusions >= 1) achDone('fuse1'); if (S.st.fusions >= 10) achDone('fuse10');
  if (Object.keys(S.recipes).length >= 5) achDone('recipe5');
  if (S.st.maxPlus >= 10) achDone('plus10'); if (S.st.maxPlus >= 50) achDone('plus50');
  if (Object.keys(S.shinyDex).length) achDone('shiny');
  if (S.st.zorome >= 10) achDone('zoro10'); if (S.st.zorome >= 100) achDone('zoro100');
  if (S.medals >= 4) achDone('medal4'); if (S.medals >= 8) achDone('medal8');
  const tb = S.tower.best;
  if (tb >= 10) achDone('tower10'); if (tb >= 30) achDone('tower30'); if (tb >= 50) achDone('tower50'); if (tb >= 100) achDone('tower100');
  if (S.st.maxLv >= MAX_LV) achDone('lv60');
  const lg = LEGENDS.filter(id => S.dex[id] === 2).length;
  if (lg >= 1) achDone('legend1'); if (lg >= 6) achDone('legend6');
  if (S.dex.daisunokami === 2) achDone('god');
  if (S.st.coinsTotal >= 20000) achDone('rich');
  if (S.st.wins >= 100) achDone('win100');
}
function addCoins(n) {
  n = Math.round(+n || 0); if (!Number.isFinite(S.coins)) S.coins = 0;

  document.body.appendChild(ov);

/* ===== おと（Web Audio で その場で つくる） ===== */
const AU = { ctx: null, master: null, music: null, fx: null, track: null, timer: null, step: 0, next: 0, want: null };

    AU.fx = AU.ctx.createGain(); AU.fx.connect(AU.master);

}
function setVol() {

}
function audioUnlock() {
  const c = auCtx(); if (!c) return;

}
const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

  g.gain.exponentialRampToValueAtTime(vol, t + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}

function noise(t, dur, vol = .2, dest, freq = 2000, q = .8) {

function sfx(name) {

  const seq = (notes, gap, type = 'square', vol = .14, len = .12) => notes.forEach((n, i) => tone(hz(n), t + i * gap, len, type, vol));
  switch (name) {

    case 'step': tone(660, t, .05, 'triangle', .1); break;

    case 'faint': tone(330, t, .45, 'square', .1, null, 60); break;
    case 'miss': tone(300, t, .15, 'triangle', .08, null, 200); break;

    case 'coin': seq(['B5', 'E6'], .07, 'square', .1, .14); break;

    const sc = e => (BT.af.filter(alive).reduce((s, a) => s + eff(a.el, e.el), 0)) * 2 - e.hp / e.mhp * 2;
    BT.tgt = foes.reduce((a, b) => sc(a) >= sc(b) ? a : b); markTarget();
  }
  while (BT.auto && BT.phase === 'pick' && BT.rr > 0) {
    const mk = autoMarks(); if (!mk.length) break;
    BT.marks = new Set(mk); updDice(); await sleep(220);
    await BT_ACT.reroll();
  }
  if (BT.auto && BT.phase === 'pick') { await sleep(180); resolveTurn(false); }
}

/* ---- どうぐ ---- */

    else if (k === 'elixir') { const u = await pickAlly('だれを おこす？', u => !alive(u)); if (!u || !useItem(k)) return; u.hp = Math.round(u.mhp / 2); u.fainted = false; const mon = uEl(u) && uEl(u).querySelector('.mon'); if (mon) mon.classList.remove('faint'); updUnit(u); drawBench(); updDice(); flyText(u, 'ふっかつ！', 'heal'); sfx('heal'); }
    else if (k === 'bento') { if (!useItem(k)) return; [...BT.af, ...BT.ab].filter(alive).forEach(u => healUnit(u, u.mhp)); drawBench(); sfx('heal'); msg('みんなで おべんとう！ ぜんかい！'); }

      else { msg(`${t.n}は ${ITEMS[k].n}を もぐもぐ… ふつうの かお。`); flyText(t, 'もぐもぐ', 'miss'); }

}

/* ---- スカウト ---- */
function scoutNeed(t) {
  let n = [2, 3, 4, 5, 6, 7, 8][SP[t.sp].r];
  const hr = t.hp / t.mhp; n += hr > .5 ? 2 : hr > .25 ? 1 : 0;
  n -= t.snack || 0;
  if (t.st.sleep || t.st.numb || t.st.burn || t.st.poison) n -= 1;
  return Math.max(2, n);
}
function throwDice(need, title, art) {
  // スカウトダイスを えらんで なげる。→ {ok, roll, bonus} | null
  return new Promise(res => {
    const kinds = ['scout', 'gold', 'rainbow'];
    const s = sheet(`<h3 class="sh">${title}</h3><div class="sc-stage">${art}<p class="need">出た目 ＋ ボーナスが <b>${need}</b> いじょう</p>${die3D([0, 0, 0, 0, 0, 0], { pips: 1, size: 84 })}<p class="sc-res"></p></div>
      <div class="sc-dice">${kinds.map(k => `<button data-k="${k}" ${S.items[k] ? '' : 'disabled'}>${itemIcon(k, 34)}${ITEMS[k].n}<small>+${ITEMS[k].bonus}・のこり ${S.items[k] || 0}</small></button>`).join('')}</div>`, { lock: 1, onClose: () => res(s._r || null) });
    s.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      const k = b.dataset.k; if (!useItem(k)) return;
      s.querySelectorAll('[data-k]').forEach(x => x.disabled = true);
      s.querySelector('.x') && (s.querySelector('.x').style.display = 'none');
      sfx('throw'); sfx('drum');
      const roll = ri(1, 6), bonus = ITEMS[k].bonus;
      const d = s.querySelector('.d3');
      orientDie(d, PIP_ON_FACE.indexOf(roll), true);
      await wait(900); sfx('land');
      orientDie(d, PIP_ON_FACE.indexOf(roll), true);
      await wait(950);
      const ok = roll + bonus >= need;
      s.querySelector('.sc-res').textContent = `${roll}${bonus ? ' ＋' + bonus : ''} ＝ ${roll + bonus}　${ok ? 'せいこう！' : 'ざんねん…'}`;
      sfx(ok ? 'ok' : 'ng');
      s._r = { ok, roll, bonus };
      await wait(1100); s.close();
    });
  });
}
async function scoutFlow() {
  if (BT.cfg.noScout) { toast(BT.cfg.kind === 'boss' ? 'ヌシは スカウトできない！' : 'この バトルでは スカウトできない'); return; }
  const t = alive(BT.tgt) ? BT.tgt : BT.ef.find(alive); if (!t) return;
  if (!S.items.scout && !S.items.gold && !S.items.rainbow) { toast('スカウトに つかう ダイスが ない！ おみせで かおう'); return; }
  const need = scoutNeed(t);
  const r = await throwDice(need, `${t.n}を スカウト`, monArt(t.sp, { size: 90, shiny: t.shiny }));
  if (!r) return;
  save();
  if (r.ok) {
    const m = makeMon(t.sp, t.lv, { shiny: t.shiny, plus: t.shiny ? 5 : 0 });
    const inParty = S.party.length < 6;
    addMon(m); S.st.scouts++; checkAch();
    t.hp = 0; updUnit(t);
    await say([`${SP[t.sp].n}が なかまに なった！`, inParty ? 'パーティに くわわった。' : 'パーティが いっぱいなので ボックスに おくった。'], { art: monArt(t.sp, { size: 110, shiny: t.shiny }) });
    finish('catch', m);
  } else {
    msg(`${t.n}は そっぽを むいた…`);
    await sleep(500);
    resolveTurn(true);
  }
}

/* ---- おわり ---- */
async function finish(res, caught) {
  if (BT.over && res !== 'catch') return;
  BT.over = true; BT.phase = 'end'; setBusy(true);
  for (const u of [...BT.af, ...BT.ab]) if (u.m) u.m.hp = clamp(u.hp, 0, mstats(u.m).hp);
  S.st.battles++;
  const out = { res, caught };
  if (res === 'win' || res === 'catch') {
    if (res === 'win') { S.st.wins++; sfx('win'); msg('しょうり！'); bgm(null); }
    await sleep(500);
    out.reward = await winRewards(res === 'win' ? BT.allE : BT.defeated);
  } else if (res === 'lose') { sfx('lose'); msg('ぜんめつ してしまった…'); bgm(null); await sleep(900); }
  checkAch(); save();
  const r = BT.resolve; r(out);
}
async function winRewards(list) {
  const k = BT.cfg.kind;
  const km = { wild: 1, trainer: 1.5, boss: 3, tower: 1.3, friend: 1.2, legend: 2 }[k] || 1;
  let exp = 0, coins = 0;
  for (const e of list) { const r = SP[e.sp].r; exp += RANK_EXP[r] * e.lv * km; coins += (r + 2) * e.lv * km; }
  exp = Math.round(exp); coins = Math.round(coins * (BT.cfg.coinMul || 1));
  if (!list.length) return { exp: 0, coins: 0 };
  addCoins(coins);
  const lines = [], evos = [];
  for (const u of [...BT.af, ...BT.ab]) {
    const m = u.m; if (!m) continue;
    if (m.hp <= 0) { lines.push({ m, g: 0, up: 0 }); continue; }
    const g = Math.round(exp * (BT.ever.has(u.id) ? 1 : .5));
    const b = m.lv, ev = giveExp(m, g);
    lines.push({ m, g, up: m.lv - b });
    if (ev.evo) evos.push(m);
  }
  if (lines.some(l => l.up)) setTimeout(() => sfx('lvup'), 300);
  await new Promise(res => {
    const s = sheet(`<p class="res-title">しょうり！</p><div class="res-gain"><span class="chip coin">💰 +${fmt(coins)}</span><span class="chip">けいけんち +${fmt(exp)}</span></div>
      <div class="res-list">${lines.map(l => `<div class="res-mon">${monArt(l.m.sp, { size: 44, shiny: l.m.shiny })}<div class="rm-tx"><b>${esc(mname(l.m))}</b> Lv${l.m.lv}${l.up ? `<span class="lvup">レベルアップ！</span>` : ''}<br>${l.g ? `+${fmt(l.g)}` : 'たおれていた'}${hpBar(l.m.exp, expNeed(l.m.lv))}</div></div>`).join('')}</div>
      <button class="btn big" data-close style="margin-top:14px">つぎへ</button>`, { lock: 1, noClose: 1, onClose: res });
  });
  for (const m of evos) await doEvolve(m);
  return { exp, coins };
}
async function doEvolve(m) {
  const from = m.sp, to = SP[m.sp].evo;
  await new Promise(res => {
    const s = sheet(`<div class="talk"><div class="evo-art">${monArt(from, { size: 120, shiny: m.shiny })}</div><p class="tl">おや？ ${mname(m)}の ようすが…！</p><button class="btn" data-go>しんかを 見まもる</button></div>`, { center: 1, lock: 1, noClose: 1, cls: 'talkbox' });

/* ===== すごろく ===== */
const COLS = 4, ROWH = 92;

function genBoard(area) {
  const n = area.len, W = area.post
    ? [['grass', 30], ['rare', 14], ['coin', 10], ['chest', 10], ['event', 10], ['trainer', 9], ['rest', 6]]
    : [['grass', 38], ['rare', 6], ['coin', 11], ['chest', 8], ['event', 12], ['trainer', 8], ['rest', 5]];
  const t = [];
  for (let i = 0; i < n; i++) t.push({ t: i === 0 ? 'start' : i === n - 1 ? 'goal' : wpick(W) });
  t[Math.floor(n / 2)] = { t: 'shop' };
  t[n - 3] = { t: 'rest' };
  if (area.idx === 0) { t[1] = { t: 'grass' }; t[3] = { t: 'grass' }; t[2] = { t: 'coin' }; }
  for (let i = 2; i < n - 1; i++) if (t[i].t === 'rest' && t[i - 1].t === 'rest') t[i] = { t: 'grass' };
  return { area: area.id, tiles: t, pos: 0, rr: 0, six: false };
}
function tilePos(i, n) {
  const row = Math.floor(i / COLS), c = i % COLS, col = row % 2 === 0 ? c : COLS - 1 - c;

const BOSS_ST = [1, .8, 1, 1, 1, .84, 1, .6];
function bossTune(area, sp) {
  if (area.post) return [sp === 'daisunokami' ? 6 : 9, sp === 'daisunokami' ? .7 : .86];
  return [BOSS_HP[area.idx], BOSS_ST[area.idx]];
}
function legendBossPick() {
  const left = LEGENDS.filter(id => S.dex[id] !== 2);
  return pick(left.length ? left : [...LEGENDS, 'daisunokami']);
}
async function bossBattle(area) {
  let [sp, lv] = area.boss;
  if (area.post) { sp = legendBossPick(); lv = 58; }
  await say([`${area.n}の ヌシ、${SP[sp].n}が あらわれた！`], { art: monArt(sp, { size: 120 }), last: 'たたかう！' });
  const [hpMul, statMul] = bossTune(area, sp);
  const r = await startBattle({ kind: 'boss', enemies: [{ sp, lv, boss: true, dual: sp === 'daisunokami', hpMul, statMul }], bg: area.c, noScout: 1, noFlee: 1, rr: S.run.rr || 0 });
  if (r.res === 'lose') return onDefeat();
  const first = !S.cleared[area.id];
  S.cleared[area.id] = (S.cleared[area.id] || 0) + 1;
  S.medals = AREAS.filter(a => !a.post && S.cleared[a.id]).length;
  const coins = Math.round(lv * (first ? 60 : 22));
  addCoins(coins);
  const got = [`コイン ${fmt(coins)}まい`];
  if (first) {
    const it = [['scout', 5], ['potion', 3], ['gold', 1], ['star', 1], ['elixir', 2], ['star', 2], ['gold', 2], ['rainbow', 1], ['prism', 1]][area.idx];
    addItem(it[0], it[1]); got.push(`${ITEMS[it[0]].n} ×${it[1]}`);
  } else if (rnd() < .5) { addItem('star'); got.push('ほしのかけら'); }
  S.run = null; healAll(); save();
  go('home');
  const lines = [first && !area.post ? `${area.n}の ヌシに かった！ ヌシメダルを てに いれた！（${S.medals}/8）` : `${area.n}を クリア！`, `ごほうび：${got.join('、')}`];
  if (first && area.idx === 3) lines.push('「ムゲンのとう」が ひらいた！ ホームから いけるよ。');
  await say(lines, { art: first && !area.post ? `<div class="medal on" style="width:80px;height:80px;font-size:46px;border-width:3px">${area.e}</div>` : monArt(sp, { size: 100 }) });
  if (area.post || sp === 'daisunokami' && area.final && S.ended) await scoutChance(sp, lv);
  if (area.final && first) {
    S.ended = true; S.charm = true; save();
    await say(STORY.ending, { art: monArt('daisunokami', { size: 120 }), last: 'おわり…？' });
    await say(['🎉 ゲームクリア！ おめでとう！', 'ここからは やりこみの じかん。ほしのうら、ムゲンのとう、ずかん かんせいを めざそう！']);
  }
  checkAch(); save(); go('home');
}
async function scoutChance(sp, lv) {
  await say([`${SP[sp].n}が なかまに なりたそうに こちらを 見ている！`], { art: monArt(sp, { size: 110 }) });
  if (!S.items.scout && !S.items.gold && !S.items.rainbow) { await say(['…でも スカウトに つかう ダイスが ない！']); return; }
  const r = await throwDice(5, `${SP[sp].n}を スカウト`, monArt(sp, { size: 90 }));
  if (r && r.ok) { addMon(makeMon(sp, Math.min(lv, MAX_LV))); S.st.scouts++; checkAch(); save(); await say([`${SP[sp].n}が なかまに なった！`], { art: monArt(sp, { size: 110 }) }); }
  else if (r) await say([`${SP[sp].n}は ほしぞらに かえっていった…`, 'また あいに こよう。']);
}
async function openChest(area) {
  const T = [['scout', 2, 34], ['potion', 2, 22], ['snack', 2, 16], ['foot', 1, 7], ['elixir', 1, 6], ['star', 1, area.idx >= 2 ? 7 : 2], ['gold', 1, area.idx >= 2 ? 8 : 1]];
  if (area.post) T.push(['rainbow', 1, 3], ['prism', 1, 3]);
  let [k, n] = (() => { const x = wpick(T.map(t => [t, t[2]])); return [x[0], x[1]]; })();
  if (k === 'snack') k = pick(Object.keys(SNACKS));
  addItem(k, n); sfx('open'); save();
  await say([`たからばこを あけた！ ${ITEMS[k].n}を ${n}こ てに いれた！`], { art: itemIcon(k, 64) });
}
async function doEvent(area) {
  const list = EVENTS.map(e => [e, e.fx.rare ? 3 : 10]);
  const ev = wpick(list), fx = ev.fx, R = S.run;
  await say([ev.t], { art: '<div style="font:54px/1 var(--fe)">❓</div>' });
  if (fx.item) { addItem(fx.item, fx.n); sfx('open'); }
  if (fx.coins) { const sc = 1 + area.idx * .6; addCoins(Math.round(ri(fx.coins[0], fx.coins[1]) * sc)); sfx('coin'); }
  if (fx.heal) partyMons().forEach(m => { if (m.hp > 0) { const mx = mstats(m).hp; m.hp = Math.min(mx, m.hp + Math.round(mx * fx.heal)); } });
  if (fx.exp) { partyMons().forEach(m => { if (m.hp > 0) { const ev2 = giveExp(m, RANK_EXP[1] * area.lv[1] * 2); } }); sfx('lvup'); }
  if (fx.reroll) R.rr = (R.rr || 0) + fx.reroll;
  if (fx.time) S.flags.clock = (S.flags.clock || 0) + fx.time;
  save();
  if (fx.battle) return wildBattle(area, false);
  if (fx.move) {
    SCR.board();
    const last = R.tiles.length - 1;
    const steps = Math.abs(fx.move), dir = Math.sign(fx.move);
    for (let s = 0; s < steps; s++) { const np = R.pos + dir; if (np < 0 || np > last) break; R.pos = np; moveTok(); sfx('step'); await sleep(200); }
    save();
    if (R.tiles[R.pos].t !== 'start') { BUSY = true; setCtl(false); await landOn(R.pos); if (S.run && $('.board')) { BUSY = false; setCtl(true); } return; }
  }
  // しんかの チェック（けいけんち イベント）
  for (const m of partyMons()) { const sp = SP[m.sp]; if (sp.evo && m.lv >= sp.evoLv) await doEvolve(m); }
  refreshBoard();
}

/* ===== ムゲンのとう ===== */
function towerEnemies(f) {
  const lv = Math.min(60, 15 + f), plus = Math.max(0, Math.round((15 + f - 60) * 1.6));
  if (f % 50 === 0) return [{ sp: 'daisunokami', lv, plus, boss: true, dual: true, hpMul: 2.6 }];
  const maxR = Math.min(5, 1 + Math.floor(f / 7));
  if (f % 5 === 0) { const bp = SP_LIST.filter(s => s.r === maxR && s.r < 6); return [{ sp: pick(bp).id, lv: Math.min(60, lv + 2), plus, boss: true, hpMul: 3 }]; }
  const pool = SP_LIST.filter(s => s.r <= maxR && s.r >= Math.max(0, maxR - 2) && s.r < 6);
  return Array.from({ length: f < 3 ? 2 : 3 }, () => ({ sp: pick(pool).id, lv, plus }));
}
async function towerRun() {
  if (!S.towerRun) { S.towerRun = { floor: 1 }; healAll(); }
  save();
  while (S.towerRun) {
    const f = S.towerRun.floor;
    if (!partyMons().some(m => m.hp > 0)) healAll();
    const r = await startBattle({ kind: 'tower', enemies: towerEnemies(f), bg: f % 5 === 0 ? '#6D5BD0' : '#9D8FE8', noScout: 1, noFlee: 1, title: `${f}かい`, coinMul: 1 });
    if (r.res === 'lose') {
      S.towerRun = null; healAll(); save(); go('tower');
      await say([`${f}かいで ちからつきた…`, `さいこう きろく：${S.tower.best}かい`]);
      return;
    }
    S.tower.best = Math.max(S.tower.best, f);
    const c = 30 + f * 12; addCoins(c);
    const got = [`コイン ${fmt(c)}`];
    if (f % 5 === 0) { addItem('star'); got.push('ほしのかけら'); }
    if (f % 10 === 0) { addItem('gold'); got.push('きんのダイス'); }
    if (f % 20 === 0) { addItem('prism'); got.push('にじのかけら'); }
    checkAch(); save();
    if (f % 50 === 0) await scoutChance('daisunokami', Math.min(60, 15 + f));
    partyMons().forEach(m => { const mx = mstats(m).hp; if (m.hp > 0) m.hp = Math.min(mx, m.hp + Math.round(mx * .3)); });
    S.towerRun.floor = f + 1; save();
    const cont = await new Promise(res => {
      const s = sheet(`<p class="res-title">${f}かい クリア！</p><p style="text-align:center;font-weight:700">${got.join('・')}</p><p class="lead" style="text-align:center">なかまの HPが すこし もどった。<br>つぎは ${f + 1}かい${(f + 1) % 5 === 0 ? '（ヌシ！）' : ''}</p><div class="row2"><button class="btn ghost" data-v="0">かえる</button><button class="btn" data-v="1">のぼる！</button></div>`, { lock: 1, noClose: 1 });
      s.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { s.close(); res(b.dataset.v === '1'); });
    });
    if (!cont) { S.towerRun = null; healAll(); save(); go('tower'); return; }
  }
}

function swapMons(a, b) {

      const m = await pickMon(k === 'a' ? '① けっとう（ぞくせいを うけつぐ）' : '② あいかた', sortMons(list), { empty: `Lv${FUSE_LV}いじょうの なかまが いない。そだてよう！` });
      if (!m) return;
      FZ[k] = m.u; FZ.child = null; SCR.fuse();
    },
    pf(el) { FZ.sel = { w: el.dataset.w, i: +el.dataset.i }; SCR.fuse(); },
    cf(el) {
      const i = +el.dataset.i;
      if (FZ.sel) {
        if (!FZ.rep[i] && Object.keys(FZ.rep).length >= slots) { toast('もう うけつげない（+を ふやすと ふえる）'); return; }
        const src = FZ.sel.w === 'a' ? ma : mb;
        FZ.child[i] = src.die[FZ.sel.i]; FZ.rep[i] = 1; FZ.sel = null; sfx('buff');
      } else if (FZ.rep[i]) { FZ.child[i] = SP[FZ.csp].die[i]; delete FZ.rep[i]; }
      else { toast('さきに うえの おやの めを えらんでね'); return; }
      SCR.fuse();
    },
    async fuse() {
      if (!(await ask(`${esc(mname(ma))} と ${esc(mname(mb))} を まぜる？<br><small>2たいは いなくなって、あたらしい こが うまれる</small>`, 'まぜる！'))) return;
      const ia = S.party.indexOf(ma.u);
      const shiny = (ma.shiny || mb.shiny) ? rnd() < .25 : rnd() < 1 / 64;
      const child = makeMon(res.sp, 1, { plus, die: FZ.child, shiny });
      S.mons = S.mons.filter(x => x.u !== ma.u && x.u !== mb.u);
      S.party = S.party.filter(u => u !== ma.u && u !== mb.u);
      addMon(child);
      if (ia >= 0) { S.party = S.party.filter(u => u !== child.u); S.party.splice(Math.min(ia, S.party.length), 0, child.u); }
      if (res.special) S.recipes[recKey(ma.sp, mb.sp)] = 1;
      S.st.fusions++; S.st.maxPlus = Math.max(S.st.maxPlus, plus);
      checkAch(); save();
      const pa = ma.sp, pb = mb.sp;
      FZ.a = FZ.b = null; FZ.child = null; FZ.rep = {}; FZ.sel = null;
      await fuseAnim(pa, pb, child.sp, shiny);
      SCR.fuse();
      monDetail(child, () => SCR.fuse());
    },
  });
};
function fuseAnim(a, b, c, shiny) {
  return new Promise(res => {
    const s = sheet(`<div class="fuse-anim"><div class="fa fa1">${monArt(a, { size: 90 })}</div><div class="fa fa2">${monArt(b, { size: 90 })}</div><div class="fa fa3" style="opacity:0;transform:scale(.3)">${monArt(c, { size: 124, shiny })}</div></div><p class="res-title" id="fz-t">まぜまぜ…</p><button class="btn big" data-close disabled id="fz-ok">やったー！</button>`, { center: 1, lock: 1, noClose: 1, onClose: res });
    const f1 = s.querySelector('.fa1'), f2 = s.querySelector('.fa2'), f3 = s.querySelector('.fa3');
    f1.style.transform = 'translateX(-80px)'; f2.style.transform = 'translateX(80px)';
    sfx('evolve');
    setTimeout(() => { f1.style.transform = 'translateX(0) scale(.5)'; f2.style.transform = 'translateX(0) scale(.5)'; }, 250);
    setTimeout(() => {
      f1.style.opacity = 0; f2.style.opacity = 0;
      const fl = document.createElement('div'); fl.className = 'flash'; document.body.appendChild(fl); setTimeout(() => fl.remove(), 500);
      f3.style.opacity = 1; f3.style.transform = 'scale(1)';
      s.querySelector('#fz-t').textContent = `${SP[c].n}が うまれた！${shiny ? '（いろちがい！）' : ''}`;
      sfx('fanfare'); s.querySelector('#fz-ok').disabled = false;
    }, 1150);
  });
}

function shopBody() {

function bindShop(root, redraw) {
  root.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {

    if (S.coins < cost) { toast('コインが たりない'); return; }
    addCoins(-cost); addItem(k, n); sfx('coin'); save();
    toast(`${ITEMS[k].n}を ${n}こ かった！`); redraw();
  });
}

/* ===== はじまり ===== */
function boot() {
  document.body.insertAdjacentHTML('afterbegin', SPRITE);
  load();
  applySpeed();
  go('title');
  const unlock = () => audioUnlock();
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
  setInterval(() => { if (S && !document.hidden) S.play += 10; }, 10000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); }
    else if (AU.ctx) AU.ctx.resume();
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL = e; });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => { });
  window.__DM = { get S() { return S; }, go, startBattle, SP, AREAS };
}
document.addEventListener('DOMContentLoaded', boot);
